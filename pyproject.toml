[project]
name = "coach"
version = "0.1.0"
description = "Unified AI Health & Fitness Coach — grounded, single-user, n=1"
readme = "README.md"
# Floor states what the code actually needs (CLAUDE.md §3), not the dev
# interpreter. Runs on 3.14 locally; ruff/mypy target 3.14. See ADR-0003.
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    # Per-user source credentials are encrypted at rest once the DB leaves the
    # laptop (ADR-0018). The stdlib ships no AEAD, and hand-rolling one is the
    # wrong instinct for a file holding other people's health-account tokens.
    # Signed off 2026-08-02 per §6.4.
    "cryptography>=43",
]

[project.scripts]
coach = "coach.cli.main:main"

[project.optional-dependencies]
# Local web UI (ADR-0014). Optional on purpose: the core CLI keeps its
# three-dependency footprint, and CLI-only users install none of this.
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",  # FastAPI's required backend for HTML form posts
]
# Local Bluetooth read of the WHOOP strap — Adapter B (ADR-0012), the
# post-membership survival path. Optional on purpose: it pulls a platform BLE
# stack that most users of the CLI have no need for, and nothing in the core
# import path touches it. Signed off 2026-08-02 per §6.4.
ble = [
    "bleak>=0.22",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Jinja templates ship with the package so a non-editable install can serve the UI.
[tool.setuptools.package-data]
coach = ["web/templates/*.html"]

# Migrations live in schema/migrations/ at the repo root and are located at
# runtime relative to the package (see coach.store.paths). This is a local,
# editable-install, single-user tool — no need to vendor SQL into the wheel.

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# MUST match requires-python, not the dev interpreter. CLAUDE.md §3 permits
# tracking the dev interpreter here, but that permission predates a real
# consequence: at py314 the FORMATTER rewrites `except (A, B):` into PEP 758's
# unparenthesized `except A, B:`, which is a SyntaxError on 3.11-3.13. The
# package then installs on those versions (metadata allows it) and fails at
# import. Two such lines had already shipped. Portability is what the floor is
# for, so the floor is what this tracks.
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter; long SQL/URLs tolerated

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
    # starlette's TestClient asks for `httpx2`; we already depend on httpx for the
    # adapters and won't add a second HTTP client for test infrastructure. This is
    # a third-party test-harness deprecation, not our code — ignored by message so
    # `error` still applies to everything else, including any of our own warnings.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.mypy]
python_version = "3.14"
warn_unused_ignores = true
ignore_missing_imports = true
